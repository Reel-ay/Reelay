spring.application.name=reelay-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reelay?characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

management.endpoints.web.exposure.include=health

logging.level.com.reelay=DEBUG

# ---- 작업자 A: SCRIPT / TTS / API ----
# 재시도는 우리 @Retryable(3회)이 맡는다. SDK 자체 재시도까지 켜면 호출이 곱절로 늘어난다
spring.ai.openai.max-retries=0
spring.ai.openai.chat.model=${REELAY_SCRIPT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.7

# TTS 응답 형식(wav)은 코드에서 고정한다. 목소리 한국어 품질은 미결 (alloy / nova 등)
# 읽기 지시문(reelay.tts.instructions)은 한글이라 SpeechClient 기본값에 둔다 (properties 는 ISO-8859-1 로 읽힘)
reelay.tts.model=gpt-4o-mini-tts
reelay.tts.voice=${REELAY_TTS_VOICE:nova}
reelay.tts.speed=1.0

# FFmpeg 렌더 동시 실행 상한 (B 와 결정)
reelay.render.max-concurrent=1

# FE 개발 서버 출처. 여러 개면 쉼표로
reelay.cors.allowed-origins=${REELAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
