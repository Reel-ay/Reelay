name: 버그
description: 동작하지 않는 것을 신고합니다
title: "[버그] "
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: 증상
      description: 무엇이 어떻게 잘못되는지
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - BE
        - FE
        - 모르겠음
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 로그·스크린샷
      description: 에러 메시지나 화면이 있으면 붙여 주세요
