name: Secret Guard
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  scan:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 설정 파일의 평문 비밀값 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 추가된 줄만 본다. 기존 코드까지 보면 오탐으로 막히기만 한다.
          added=$(git diff "$BASE" "$HEAD" -- \
                    '*.yml' '*.yaml' '*.properties' '*.env' '*.json' \
                  | grep -E '^\+' | grep -v '^+++' || true)

          # api.key / api-key / api_key 를 잡고, ${ENV}·빈 값·주석·플래그 값은 통과시킨다.
          bad=$(printf '%s\n' "$added" \
                | grep -Ev '^\+[[:space:]]*(#|!|//)' \
                | grep -Ei '(api[-_.]?key|secret|passwo?rd|token|credential)[[:space:]]*[:=][[:space:]]*[^$[:space:]"]' \
                | grep -v '\${' \
                | grep -Eiv '[:=][[:space:]]*(true|false|none|null|enabled|disabled)[[:space:]]*$' \
                || true)

          if [ -n "$bad" ]; then
            echo "::error::설정 파일에 평문 비밀값으로 보이는 줄이 있습니다."
            printf '%s\n' "$bad" | sed 's|^|::error::  |'
            echo "::error::\${OPENAI_API_KEY} 처럼 환경변수 참조로 바꾸고,"
            echo "::error::실제 값은 application-local.yml(gitignore 대상)에 두세요."
            exit 1
          fi
          echo "설정 파일에 평문 비밀값 없음. OK"

      - name: 알려진 키 형식 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff "$BASE" "$HEAD" | grep -E '^\+' | grep -v '^+++' || true)
          # OpenAI(sk-), AWS(AKIA), Google(AIza), GitHub(ghp_/gho_/ghs_/ghu_)
          hit=$(printf '%s\n' "$added" \
                | grep -E 'sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[posu]_[A-Za-z0-9]{36}' \
                || true)
          if [ -n "$hit" ]; then
            echo "::error::API 키 형식의 문자열이 추가되었습니다."
            echo "::error::커밋에서 제거하고, 해당 키는 반드시 폐기·재발급하세요."
            exit 1
          fi
          echo "알려진 키 형식 없음. OK"
